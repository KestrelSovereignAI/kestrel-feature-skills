[project]
name = "kestrel-feature-skills"
version = "0.1.0"
description = "Folder-shaped, progressively disclosed procedural skills for Kestrel Sovereign"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115,<1",
    "kestrel-sovereign>=0.53.10,<0.54",
    "kestrel-sovereign-sdk>=0.37.1,<0.38",
]

[project.optional-dependencies]
test = [
    "hatchling>=1.27",
    "httpx>=0.27,<1",
    "pytest>=8.0",
    "pytest-asyncio>=1.1",
    "pytest-timeout>=2.3",
]

[dependency-groups]
dev = [
    "hatchling>=1.27",
    "httpx>=0.27,<1",
    "pytest>=8.0",
    "pytest-asyncio>=1.1",
    "pytest-timeout>=2.3",
]

[project.urls]
Homepage = "https://kestrelsovereign.com"
Source = "https://github.com/KestrelSovereignAI/kestrel-feature-skills"
Issues = "https://github.com/KestrelSovereignAI/kestrel-sovereign/issues/3018"

[project.entry-points."kestrel_sovereign.features"]
ProceduralSkillsFeature = "kestrel_feature_skills:ProceduralSkillsFeature"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel_feature_skills"]
artifacts = ["src/kestrel_feature_skills/static/**/*", "src/kestrel_feature_skills/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/workflows/*.yml",
    "/AGENTS.md",
    "/LICENSE",
    "/README.md",
    "/SKILL.md",
    "/pyproject.toml",
    "/src/kestrel_feature_skills/**/*",
    "/tests/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
