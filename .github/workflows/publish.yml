name: Publish to PyPI

# The trusted-publisher binding is scoped to this repository, workflow, and
# ``pypi`` environment. Every artifact is built only after the reusable CI
# workflow passes against the exact tag SHA; no API token is used.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Exact semantic-version release tag (for example v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve immutable release revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Validate and resolve release tag once
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_name="$INPUT_TAG"
          else
            tag_name="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag_name" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$tag_name is not an exact vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$tag_name^{commit}")
          echo "tag=$tag_name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  ci:
    name: CI gate
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  build:
    name: Build sdist + wheel
    needs: [resolve, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Verify tag and package versions match
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          tag_version="${RELEASE_TAG#v}"
          package_version=$(uv run --no-project python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::tag $RELEASE_TAG does not match pyproject.toml version $package_version"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
